version: 2
updates:
  # Dos capas de protección, después de dos incidentes reales el mismo día:
  #
  # 1) El grupo agrupado (npm_and_yarn) queda restringido a minor/patch
  #    (update-types abajo). Un salto de versión MAYOR de cualquier paquete
  #    ya no puede viajar escondido dentro de un bundle de 40+ paquetes —
  #    si Dependabot lo propone, sale como su propio PR chico y con nombre
  #    claro ("Bump X from 7.x to 8.x"), fácil de detectar en la lista de
  #    PRs en vez de enterrado en la descripción de un update grupal.
  #    (Encontrado así: PR #122/#123, @babel/core saltó a 8.x adentro de un
  #    bump de 41/46 paquetes y rompió el build de las dos apps.)
  #
  # 2) Para los paquetes de mayor blast radius si igual llegaran a
  #    proponerse solos, quedan explícitamente ignorados en versión mayor:
  #    Express saltó de 4.x a 5.x así (PR #115-#117, sitio caído en
  #    producción hasta encontrar la causa). Parche/minor siguen entrando
  #    solos en los dos casos — un salto mayor necesita revisión humana
  #    deliberada.
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mongoose"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
