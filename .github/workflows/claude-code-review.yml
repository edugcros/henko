# Revisión automática de cada PR.
#
# ESTE WORKFLOW ESTUVO ROTO DOS MESES Y MEDIO SIN QUE NADIE SE ENTERARA
#
# Última corrida exitosa: 18/07/2026. Desde ahí, 274 fallas seguidas sobre 300
# corridas. El archivo no se tocó desde que se creó, así que lo que se rompió
# fue la credencial: funcionó diez días y nunca más.
#
# El síntoma era visible en cada PR —un check en rojo— pero como no bloquea el
# merge, se volvió parte del paisaje. Eso es lo que hace daño de verdad: un
# rojo permanente entrena a ignorar los rojos, que es exactamente cómo la
# rotura de eslint 10 llegó a producción y se quedó 12 deployments.
#
# Para que vuelva a andar hay que regenerar CLAUDE_CODE_OAUTH_TOKEN.
#
# POR QUÉ SE LE PUSIERON DOS FRENOS ANTES DE REVIVIRLO
#
# Medido sobre esas 300 corridas: el 40% las disparó Dependabot, y una sola
# rama acumuló 46 revisiones completas porque cada push arranca una nueva sin
# cancelar la anterior. Con la credencial arreglada y sin estos frenos, eso se
# convierte en consumo real de la suscripción, a ese ritmo, desde el primer día.
#
#  1. Dependabot queda afuera. Un bump de versión no tiene criterio que revisar;
#     lo que hay que verificar de un PR así —que instale, compile y pase las
#     pruebas— ya lo hace ci.yml, que sí bloquea el merge.
#
#  2. Un push nuevo cancela la revisión anterior de ese PR. Revisar un commit
#     que ya fue reemplazado no le sirve a nadie.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

