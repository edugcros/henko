# Instala, construye y prueba los tres paquetes en cada PR.
#
# POR QUE EXISTE
#
# Hasta ahora ningún workflow instalaba ni construía las apps: los únicos que
# corrían eran la revisión de código y las menciones a @claude. El primero en
# enterarse de que algo se rompía era Vercel, en un deployment de producción.
#
# Pasó tres veces seguidas, siempre igual: un PR de Dependabot subía un mayor,
# el árbol de dependencias quedaba irresoluble, el merge entraba a main y la
# build de producción moría en `npm install`, antes de compilar una línea.
# Express 4→5 (PR #115-#117, sitio caído), @babel/core 7→8 (PR #122/#123, las
# dos apps) y eslint 9→10 (PR #223, el panel y la tienda; la tienda estuvo 12
# deployments en ERROR sin que nadie lo viera).
#
# El paso que ataja esa clase de rotura es `npm ci`. Los tres incidentes se
# habrían puesto rojos en el primer step de este workflow.
#
# POR QUE `npm ci` Y NO `npm install`
#
# `npm ci` falla si el lockfile no concuerda con el package.json, en vez de
# arreglarlo en silencio. Eso convierte "el lockfile quedó desincronizado" en un
# PR rojo y no en una sorpresa en el próximo deploy.
#
# POR QUE build:ci Y NO build
#
# `npm run build` corre con APP_ENV=production, y eso dispara assertDeployEnv()
# en webpack.env.js, que exige las REACT_APP_* reales del deploy. Meterlas acá
# significaría o secretos de producción en CI o valores falsos que hay que
# mantener coherentes con los validadores. `build:ci` compila en modo producción
# con APP_ENV=development: verifica que el bundle se arme —imports, sintaxis,
# módulos faltantes— sin pedir ningún secreto. La validación del entorno real de
# cada app la sigue haciendo Vercel en cada deploy, que es donde corresponde.
#
# LO QUE TODAVIA NO GATEA
#
# El lint de admin y website. Sus scripts llevan `--fix`, así que nunca pueden
# fallar, y el glob `src/**/*.{js,jsx}` sin globstar alcanza un solo nivel de
# directorios. Arreglar eso destapa ~3951 errores de formato de prettier, que es
# una normalización aparte (va con el .gitattributes, porque la mitad son
# finales de línea). El backend sí corre lint acá: su script no lleva `--fix`.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la corrida anterior: lo que importa
# es el estado del último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # `resolveTestDbUri` la prefiere sobre MONGODB_URL y le agrega el sufijo,
      # así que la base efectiva es `henko-test`. El `?replicaSet=rs0` es lo que
      # hace que el driver descubra la topologia y habilite transacciones; sin
      # eso, ver el comentario del paso que levanta Mongo.
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/henko?replicaSet=rs0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # .nvmrc es la única fuente de la versión de Node en el repo.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 7 de las 68 suites pasan por `src/test/testDB.js`, que conecta a un
      # mongod REAL —no a uno en memoria, como hacen las otras 26— y de ahí
      # deriva el nombre de la base agregándole `-test`. Sin un servidor al que
      # conectar, `mongoose.connect` se queda esperando y el hook muere.
      #
      # Se levanta a mano en vez de con `services:` por una razón práctica: de
      # los service containers, Actions volca el log entero al final del job.
      # Son 32 mil líneas de mongod que sepultan la salida de Jest y dejan el
      # fallo ilegible. Un contenedor propio no se volca, y además deja pasarle
      # `--quiet`, que `services:` no permite (acepta opciones de docker run,
      # no el comando del contenedor).
      # Replica set de UN nodo, no un mongod suelto. No es un lujo:
      # `src/utils/withOptionalTransaction.js` decide si usa transacciones por la
      # TOPOLOGIA que informa el driver, y solo las activa con
      # `ReplicaSetWithPrimary` o `Sharded`. Sobre standalone sigue de largo sin
      # transaccion, asi que `reserveStockAtomic` descuenta la primera linea y no
      # la deshace cuando la segunda falla — y el test que cubre justamente esa
      # atomicidad (`order.test.js`) da stock 7 en vez de 10.
      #
      # O sea que correr el CI sobre standalone no solo falla ese test: deja sin
      # ejercitar todo lo que depende de atomicidad, que es lo que en produccion
      # sostiene el stock. El propio archivo cuenta que esa deteccion estuvo
      # rota toda su vida sin que ninguna prueba lo notara.
      #
      # Sin `directConnection`: hace falta que el driver DESCUBRA el replica set
      # para que informe ReplicaSetWithPrimary. Con directConnection informaria
      # `Single` y volveriamos al mismo problema por otro camino.
      - name: Levantar MongoDB como replica set
        run: |
          docker run -d --name henko-mongo -p 27017:27017 mongo:7 \
            mongod --bind_ip_all --quiet --replSet rs0

          for _ in $(seq 1 30); do
            if docker exec henko-mongo \
                 mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          docker exec henko-mongo mongosh --quiet --eval '
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })
          '

          # Esperar a que el nodo sea PRIMARY: recien ahi el driver informa
          # ReplicaSetWithPrimary y las transacciones quedan disponibles.
          for _ in $(seq 1 30); do
            if docker exec henko-mongo \
                 mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              echo "replica set rs0 con PRIMARY"
              exit 0
            fi
            sleep 2
          done

          echo "el replica set no llego a PRIMARY en 60s"
          docker logs henko-mongo
          exit 1

      - run: npm ci

      - run: npm run lint

      - run: npm test

  admin:
    name: admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      - run: npm run build:ci

      - run: npm test

  website:
    name: website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - run: npm run build:ci

      - run: npm test
