services:
  - type: web
    name: henko-api
    # El servicio real en Render corre en el plan Free (confirmado contra la
    # API de Render, no asumido) — no en `starter`. Ver EMAIL_TRANSPORT abajo:
    # esto es lo que obliga a usar la Web API de SendGrid en vez de SMTP.
    plan: free
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PREFIX
        value: /api
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: true
      - key: PREDEPLOY_TUNNEL_MODE
        value: false
      - key: AI_AGENT_MAX_OUTPUT_TOKENS
        value: "1200"
      # Disyuntor de gasto de IA: techo mensual de tokens de TODA la
      # plataforma contra GEMINI_API_KEY. Sin esto el techo real es la suma de
      # las cuotas de todos los tenants, así que un solo plan mal cargado lo
      # elimina. ~20M tokens son unos USD 18/mes con la tarifa por defecto.
      # REVISAR: con free = 1,5M tokens esto cubre ~13 comercios gratuitos
      # activos. Ajustar contra el consumo real de AiPlatformUsage después del
      # primer mes. Ver backend/docs/AI_COST_CONTAINMENT.md.
      - key: AI_PLATFORM_MONTHLY_TOKEN_BUDGET
        value: "20000000"
      # Ningún comercio sobre la key compartida puede pasarse de esta fracción
      # del presupuesto. Evita que un tenant grande sin key propia haga saltar
      # el disyuntor y deje sin asistente a todos los demás.
      - key: AI_PLATFORM_PER_TENANT_SHARE
        value: "0.5"
      - key: AUTO_ANALYZE
        value: true
      - key: AUTO_CREATE_PRODUCT
        value: true
      - key: AUTO_PUBLISH_PRODUCT
        value: false
      # Correo transaccional: verificación de cuenta, reseteo de contraseña,
      # confirmación de pedido, recuperación de carrito. Verificado en vivo el
      # 14/08/2026 contra un Single Sender real de SendGrid — no es teórico.
      # Detalle completo en backend/docs/EMAIL_PRODUCTION.md.
      #
      # EMAIL_TRANSPORT=sendgrid_api usa la Web API de SendGrid (HTTPS/443),
      # no smtp ni la API de Resend. Un primer intento con EMAIL_TRANSPORT=smtp
      # contra smtp.sendgrid.net:587 se quedó colgado sin error en producción:
      # este servicio corre en el plan Free de Render, que bloquea los
      # puertos SMTP salientes (25, 465, 587) desde septiembre 2025. La Web
      # API usa el mismo puerto 443 que cualquier fetch, así que no choca con
      # ese bloqueo.
      - key: EMAIL_TRANSPORT
        value: sendgrid_api
      # Sin efecto bajo sendgrid_api (son de nodemailer/smtp) — quedan
      # documentados por si algún día se corre este backend en un plan pago
      # y conviene volver a smtp.
      - key: EMAIL_HOST
        value: smtp.sendgrid.net
      - key: EMAIL_PORT
        value: "587"
      # Literal "apikey" — no es un usuario real, así lo exige SendGrid bajo
      # smtp. sendgrid_api no lo usa (la key va en el header Authorization).
      - key: EMAIL_USER
        value: apikey
      # La API key de SendGrid (Full Access: manda correo Y administra
      # dominios por comercio — sin el scope de dominios, "conectar mi
      # dominio" en el panel deja de poder verificar nada). Cargarla a mano
      # acá, nunca en el repo. Sirve igual para sendgrid_api y para smtp.
      - key: EMAIL_PASS
        sync: false
      # La dirección verificada como Single Sender en SendGrid (Settings →
      # Sender Authentication → Verify a Single Sender). Sin verificar
      # exactamente esa dirección ahí, SendGrid rechaza el envío aunque la key
      # sea válida.
      - key: EMAIL_FROM
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: MONGO_ENABLE_TRANSACTIONS
        value: true
      - key: MONGO_FORCE_PUBLIC_DNS
        value: true
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
